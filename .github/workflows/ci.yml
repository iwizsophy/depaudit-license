name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          files=$(find . -name '*.go' -not -path './dist/*' -not -path './bin/*')
          if [ -n "$files" ]; then
            unformatted=$(gofmt -l $files)
            if [ -n "$unformatted" ]; then
              echo "The following files need gofmt:"
              echo "$unformatted"
              exit 1
            fi
          fi

  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./...

  smoke:
    runs-on: ubuntu-latest
    needs:
      - format
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run smoke report generation
        run: >
          go run .
          -input repository-scan=./internal/ci/testdata/repo
          -input cyclonedx-json=./internal/sbom/testdata/cyclonedx/app.json
          -output-html dist/ci-report.html
          -output-json dist/ci-report.json
          -output-legal-html dist/ci-legal-notice.html

      - name: Validate smoke outputs
        shell: bash
        run: |
          files=(
            dist/ci-report.html
            dist/ci-report.json
            dist/ci-legal-notice.html
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing smoke output: $file" >&2
              exit 1
            fi
          done

  release-build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs:
      - format
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/release
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          go build -trimpath -o "dist/release/depaudit-license-${GOOS}-${GOARCH}${ext}" .
